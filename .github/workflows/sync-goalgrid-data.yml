name: Sync GoalGrid V7 predictions

on:
  workflow_dispatch:
  schedule:
    - cron: '47 5 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out preview app
        uses: actions/checkout@v4

      - name: Download latest GoalGrid predictions
        run: |
          curl -fL "https://raw.githubusercontent.com/ojay195/goalgrid-v7/automation-test/automation/data/goalgrid_predictions.json" -o automation/data/goalgrid_predictions.json

      - name: Publish updated predictions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/data/goalgrid_predictions.json
          git diff --cached --quiet || git commit -m "Sync latest GoalGrid V7 predictions"
          git push
